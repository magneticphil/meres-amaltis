<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plantes mères</title>
<meta name="theme-color" content="#b8860b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mères">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg:#f6f4ee; --card:#fff; --ink:#1f1d17; --mute:#6f6a5d; --line:#e5e0d3;
    --acc:#8a6414; --acc2:#f6ecd2; --leaf:#2c6a48; --leaf2:#e4f1e8; --warn:#b42318; --warn2:#fdecea;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .hidden { display:none !important; }
  button, input, select, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }

  #login { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-box { background:var(--card); border-radius:16px; padding:24px; width:100%; max-width:360px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  .login-box img { width:56px; height:56px; border-radius:13px; display:block; margin-bottom:12px; }
  .login-box h1 { font-size:20px; margin:0 0 4px; }
  .login-box p { margin:0 0 18px; color:var(--mute); }

  header { position:sticky; top:0; z-index:5; background:var(--bg); padding:calc(env(safe-area-inset-top) + 10px) 16px 6px; }
  .top { display:flex; align-items:center; gap:8px; }
  .top h1 { font-size:18px; margin:0; flex:1; }
  .who { color:var(--mute); font-size:13px; }
  .icon-btn { border:0; background:transparent; font-size:18px; padding:6px 8px; border-radius:8px; }
  .chips { display:flex; gap:6px; overflow-x:auto; padding:8px 0 4px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:5px 12px; font-size:14px; }
  .chip.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  .chip small { opacity:.75; margin-left:3px; }
  .search { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); font-size:16px; margin-top:6px; }

  main { padding:4px 16px calc(env(safe-area-inset-bottom) + 96px); max-width:720px; margin:0 auto; }
  h2 { font-size:16px; margin:18px 0 8px; }
  h2 small { color:var(--mute); font-weight:400; }
  .stats { display:flex; gap:8px; margin:8px 0 4px; }
  .stat { flex:1; background:var(--card); border-radius:12px; padding:10px 12px; }
  .stat b { display:block; font-size:22px; }
  .stat span { font-size:12px; color:var(--mute); }

  .card { background:var(--card); border-radius:12px; display:flex; overflow:hidden; margin-bottom:8px; box-shadow:0 1px 2px rgba(0,0,0,.04); }
  .card.tap { cursor:pointer; }
  .card .bar { width:5px; flex:0 0 5px; background:var(--leaf); }
  .card.det .bar { background:#b9b2a2; }
  .card .body { padding:10px 12px; flex:1; min-width:0; }
  .ttl { font-weight:700; font-size:16px; line-height:1.3; }
  .ttl .nick { display:inline-block; background:var(--acc2); color:var(--acc); border-radius:6px; padding:0 6px; margin-right:6px; font-size:14px; }
  .num { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; color:var(--ink); word-break:break-all; }
  .meta { font-size:12px; color:var(--mute); margin-top:3px; }
  .tag { display:inline-block; font-size:12px; font-weight:600; border-radius:999px; padding:1px 8px; }
  .tag.ok { background:var(--leaf2); color:var(--leaf); }
  .tag.off { background:#eee9de; color:var(--mute); }
  .tag.warn { background:var(--warn2); color:var(--warn); }
  .tag.gold { background:var(--acc2); color:var(--acc); }
  .card.det .ttl, .card.annul .ttl { color:var(--mute); }
  .card.annul { opacity:.6; }
  .acts { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .btn { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 10px; font-size:14px; }
  .btn.pri { background:var(--acc); border-color:var(--acc); color:#fff; }
  .btn.ok { background:var(--leaf2); border-color:var(--leaf2); color:var(--leaf); font-weight:600; }
  .btn.dan { color:var(--warn); }
  .btn.full { width:100%; padding:12px; font-size:16px; }
  .empty { color:var(--mute); padding:8px 0 4px; font-size:14px; }
  .grp { background:var(--card); border-radius:12px; padding:10px 12px; margin-bottom:8px; }
  .grp-h { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .grp-h b { font-size:15px; }
  .grp-l { font-size:13px; margin-top:6px; border-top:1px solid var(--line); padding-top:6px; }
  .grp-l div { display:flex; justify-content:space-between; gap:8px; padding:2px 0; }
  .jr { background:var(--card); border-radius:10px; padding:8px 12px; margin-bottom:6px; font-size:13px; }
  .jr b { font-size:14px; }

  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:6; display:flex; background:rgba(255,255,255,.96); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  .tabs button { flex:1; border:0; background:transparent; padding:10px 0 12px; font-size:13px; color:var(--mute); }
  .tabs button.on { color:var(--acc); font-weight:600; }
  .fab { position:fixed; right:18px; bottom:calc(env(safe-area-inset-bottom) + 66px); z-index:7; width:56px; height:56px; border-radius:50%; border:0; background:var(--acc); color:#fff; font-size:30px; line-height:56px; box-shadow:0 4px 12px rgba(0,0,0,.2); }

  .overlay { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; justify-content:center; }
  .panel { background:var(--bg); width:100%; max-width:560px; max-height:92vh; overflow-y:auto; border-radius:16px 16px 0 0; padding:16px 16px calc(env(safe-area-inset-bottom) + 16px); }
  .panel h3 { margin:0 0 12px; font-size:18px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  label { display:block; font-size:13px; color:var(--mute); margin:12px 0 4px; }
  input[type=text], input[type=date], input[type=number], input[type=password], input[type=search], select, textarea {
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); font-size:16px; }
  textarea { min-height:64px; resize:vertical; }
  .hint { font-size:12px; color:var(--mute); margin-top:4px; }
  .hint.ok { color:var(--leaf); }
  .hint.bad { color:var(--warn); }
  .pills { display:flex; flex-wrap:wrap; gap:6px; }
  .pills label { margin:0; }
  .pills input { display:none; }
  .pills span { display:inline-block; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; font-size:14px; color:var(--ink); }
  .pills input:checked + span { background:var(--acc); border-color:var(--acc); color:#fff; }
  .check { display:flex; align-items:center; gap:8px; color:var(--ink); font-size:15px; }
  .check input { width:20px; height:20px; flex:0 0 20px; }
  .two { display:flex; gap:8px; } .two > div { flex:1; min-width:0; }
  .kv { background:var(--card); border-radius:12px; padding:4px 12px; }
  .kv div { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .kv div:last-child { border-bottom:0; }
  .kv span { color:var(--mute); }
  .kv b { font-weight:600; text-align:right; word-break:break-all; }
  .pick { background:var(--card); border-radius:10px; display:flex; align-items:center; gap:10px; padding:8px 10px; margin-bottom:6px; }
  .pick .l { flex:1; min-width:0; }
  .pick input { width:84px; padding:8px; border:1px solid var(--line); border-radius:8px; font-size:16px; text-align:right; }
  .total { position:sticky; bottom:-16px; background:var(--bg); padding:10px 0 4px; font-weight:600; }
  .err { color:var(--warn); font-size:14px; margin-top:10px; min-height:1em; }
  .alert { background:var(--warn2); color:var(--warn); border-radius:10px; padding:10px 12px; font-size:14px; margin:8px 0; }
  .foot { display:flex; gap:8px; margin-top:16px; }
  .foot .btn { flex:1; padding:12px; font-size:16px; }

  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 130px); transform:translateX(-50%); background:var(--ink); color:#fff; padding:8px 14px; border-radius:10px; font-size:14px; z-index:20; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:.92; }
  #busy { position:fixed; top:0; left:0; height:3px; background:var(--acc); z-index:30; width:0; transition:width .4s; }
</style>
</head>
<body>
<div id="busy"></div>

<div id="login">
  <div class="login-box">
    <img src="icone-192.png" alt="">
    <h1>Plantes mères</h1>
    <p>Amaltis — identifiez-vous</p>
    <label for="l-nom">Nom</label>
    <select id="l-nom"><option>Chargement…</option></select>
    <label for="l-code">Code</label>
    <input id="l-code" type="password" inputmode="numeric" autocomplete="off">
    <div class="err" id="l-err"></div>
    <button class="btn pri full" id="l-go">Se connecter</button>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="top">
      <h1 id="titre">Plantes mères</h1>
      <span class="who" id="who"></span>
      <button class="icon-btn" id="refresh" title="Actualiser" aria-label="Actualiser">↻</button>
      <button class="icon-btn" id="logout" title="Déconnexion" aria-label="Déconnexion">⎋</button>
    </div>
    <div id="alerte" class="alert hidden" role="alert"><span></span> <button class="btn" style="padding:2px 8px;font-size:13px" onclick="this.parentNode.classList.add('hidden')">OK</button></div>
    <div id="file-rappel" class="alert hidden" role="status"></div>
    <div id="hdr-extra"></div>
  </header>
  <main>
    <section id="v-meres"></section>
    <section id="v-boutures" class="hidden"></section>
    <section id="v-destr" class="hidden"></section>
    <section id="v-journal" class="hidden"></section>
  </main>
  <button class="fab" id="fab" aria-label="Ajouter">+</button>
  <nav class="tabs">
    <button data-v="meres" class="on">Mères</button>
    <button data-v="boutures">Boutures</button>
    <button data-v="destr">Destructions</button>
    <button data-v="journal" id="tab-journal" class="hidden">Journal</button>
  </nav>
</div>

<div id="ov" class="overlay hidden"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* Adresse du script Google (déploiement « Application Web ») */
const API_URL = 'https://script.google.com/macros/s/AKfycbxVEe4LoQHxOFyT7KKShe_kwPFshdV0WlCYIa1yoiy18oykci4cvOq57MHk1HDOpY7p/exec';

const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const RAISONS = ['Âge', 'Perte de vigueur', 'Maladie ou ravageur', 'Fin du cultivar', 'Autre'];
const ETAPES = ['Boutures non plantées', '4 pouces', 'En salle'];
const RAISONS_PLANTS = ['Surplus', 'Plants faibles ou non racinés', 'Maladie ou ravageur', 'Autre'];
const NB_SALLE = [336, 448];  // plants habituellement transférés dans une grande salle (moins en salle 7)
const S = { auth:null, d:null, vue:'meres', filtre:'active', cult:'Tous', q:'' };

/* ---------- Utilitaires ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2400); }
let busyN = 0;
function busy(on) { busyN = Math.max(0, busyN + (on ? 1 : -1)); $('busy').style.width = busyN ? '70%' : '0'; }
const rid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2);
const errMsg = e => (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, '');
const estPanne = e => /network|réseau|failed to fetch|load failed|timeout|délai|internal|interne/i.test(errMsg(e));

function appel(fn, ...args) {
  if (/^COLLER_ICI/.test(API_URL)) return Promise.reject(new Error("L'adresse du script n'est pas encore configurée."));
  const envoi = () => fetch(API_URL, { method:'POST', body:JSON.stringify({ fn, args }), redirect:'follow' })
    .then(r => { if (!r.ok) throw new Error('Erreur réseau (' + r.status + ')'); return r.json(); });
  const lecture = ['listerNoms', 'charger', 'journal'].includes(fn);
  busy(true);
  return envoi().catch(e => { if (!lecture) throw e; return new Promise(ok => setTimeout(ok, 1500)).then(envoi); })
    .then(j => { busy(false); if (!j.ok) { const e = new Error(j.error); e.definitif = !!j.definitif; throw e; } return j.data; },
          e => { busy(false); throw e; });
}
const run = (fn, ...a) => appel(fn, S.auth.nom, S.auth.code, ...a);

if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});

/* Dates AAAA-MM-JJ */
const toD = s => { const p = s.split('-').map(Number); return new Date(Date.UTC(p[0], p[1]-1, p[2])); };
const fDate = s => { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return s || ''; const d = toD(s); return d.getUTCDate() + ' ' + MOIS[d.getUTCMonth()] + ' ' + d.getUTCFullYear(); };
function age(s) {
  if (!s || !S.d) return '';
  const j = Math.round((toD(S.d.today) - toD(s)) / 864e5);
  if (j < 60) return j + ' j';
  const m = Math.floor(j / 30.44);
  return m < 24 ? m + ' mois' : (m / 12).toFixed(1).replace('.', ',') + ' ans';
}
const FORMAT = /^\d{12}_[0-9A-Z]+$/;
const norm = s => String(s || '').replace(/\s+/g, '').toUpperCase();
function dateDuNumero(n) {
  const m = /^(\d{4})(\d{2})(\d{2})\d{4}_/.exec(n); if (!m) return '';
  const s = m[1] + '-' + m[2] + '-' + m[3], d = toD(s);
  return d.getUTCMonth() + 1 === +m[2] && d.getUTCDate() === +m[3] && +m[1] >= 2015 && (!S.d || s <= S.d.today) ? s : '';
}
const lotDuNumero = n => { const i = n.lastIndexOf('_'); return i > 0 ? n.slice(i + 1) : ''; };
const abrege = n => { const m = /^\d{8}(\d{4})_(.+)$/.exec(n); return m ? m[1] + '_' + m[2] : n; };
const nomMere = m => (m.surnom ? m.surnom + ' · ' : '') + m.cultivar;
const mere = num => S.d.meres.find(m => norm(m.numero) === norm(num));
const actives = () => S.d.meres.filter(m => m.statut === 'active');
const isAdmin = () => S.d && S.d.role === 'admin';

/* ---------- Connexion ---------- */
async function initLogin() {
  const saved = load('meres_auth');
  if (saved) {
    S.auth = saved;
    const cache = load('meres_data_' + saved.nom.toLowerCase());
    if (cache) { start(cache); refresh(true); return; }
    try { start(await run('charger')); return; } catch (e) { if (/code invalide/i.test(errMsg(e))) store('meres_auth', null); else { $('l-err').textContent = errMsg(e); } }
  }
  try {
    const noms = await appel('listerNoms');
    $('l-nom').innerHTML = noms.map(n => '<option>' + esc(n) + '</option>').join('');
    const dernier = load('meres_dernier_nom'); if (dernier && noms.includes(dernier)) $('l-nom').value = dernier;
  } catch (e) { $('l-nom').innerHTML = '<option value="">—</option>'; $('l-err').textContent = errMsg(e); }
}
async function login() {
  const nom = $('l-nom').value, code = $('l-code').value.trim();
  if (!nom || !code) { $('l-err').textContent = 'Choisissez votre nom et entrez votre code.'; return; }
  $('l-go').disabled = true; $('l-err').textContent = '';
  S.auth = { nom, code };
  try { const d = await run('charger'); store('meres_auth', S.auth); store('meres_dernier_nom', nom); start(d); }
  catch (e) { S.auth = null; $('l-err').textContent = errMsg(e); }
  finally { $('l-go').disabled = false; }
}
function logout(force) {
  const n = S.auth ? qGet().length : 0;
  if (n && !force && !confirm(n + ' action' + (n > 1 ? 's' : '') + " pas encore transmise" + (n > 1 ? 's' : '') + " au registre. Elle" + (n > 1 ? 's' : '') + " partir" + (n > 1 ? 'ont' : 'a') + " à votre prochaine connexion. Se déconnecter quand même ?")) return;
  store('meres_auth', null); S.auth = null; S.d = null; location.reload();
}
function start(d) {
  apply(d);
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  scheduleFlush(0);
}
/* Données du serveur (S.srv) + actions encore en file d'envoi = ce qui est affiché (S.d). */
function apply(d) {
  S.srv = d; S.auth.nom = d.moi;
  if (d.requetes) { const k = new Set(d.requetes), q = qGet(), r = q.filter(it => !k.has(it.id)); if (r.length !== q.length) qSet(r); }
  store('meres_data_' + S.auth.nom.toLowerCase(), d);
  $('who').textContent = d.moi;
  $('tab-journal').classList.toggle('hidden', d.role !== 'admin');
  recalc();
}
function recalc() { if (!S.srv) return; S.d = superposer(S.srv); render(); rappelFile(); }
async function refresh(quiet) {
  if (!$('ov').classList.contains('hidden')) return;
  try { apply(await run('charger')); if (!quiet) toast('À jour'); }
  catch (e) { if (/code invalide/i.test(errMsg(e))) logout(true); else if (!quiet) toast(errMsg(e)); }
}

/* ---------- Envoi en arrière-plan des saisies ----------
   Une action (création, prise de boutures, destruction, modification, RSDC) est affichée et comptée
   aussitôt, puis gardée sur le téléphone (file d'envoi) jusqu'à ce que le serveur la confirme.
   Chaque action a un identifiant unique : renvoyée plusieurs fois (réseau lent, app fermée puis
   rouverte), elle n'est enregistrée qu'une fois (le serveur l'inscrit au Journal, colonne Requête). */
const qKey = () => 'meres.file.' + String(S.auth && S.auth.nom || '').toLowerCase();
function qGet() { const q = load(qKey()); return Array.isArray(q) ? q : []; }
function qSet(q) { store(qKey(), q.length ? q : null); }
const maintenant = () => { const d = new Date(), z = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds()); };
function enfiler(fn, args) {
  const q = qGet(); q.push({ id: rid(), fn, args, t: Date.now(), at: maintenant() }); qSet(q);
  recalc(); scheduleFlush(0);
}
/* Applique les actions en attente sur une copie des données du serveur. */
function superposer(srv) {
  const d = JSON.parse(JSON.stringify(srv)), moi = srv.moi;
  d.destructionsPlants = d.destructionsPlants || [];
  const trouve = num => d.meres.find(m => norm(m.numero) === norm(num));
  qGet().forEach(it => {
    const a = it.args;
    if (it.fn === 'creerMere') {
      const n = norm(a[0].numero); if (trouve(n)) return;
      const crea = a[0].creation || dateDuNumero(n);
      d.meres.push({ numero:n, surnom:(a[0].surnom || '').trim(), lot:(a[0].lot || '').trim().toUpperCase() || lotDuNumero(n), cultivar:(a[0].cultivar || '').trim(),
        creation:crea, source:a[0].creation ? 'saisie' : crea ? 'numéro' : 'inconnue', parent:a[0].parent ? norm(a[0].parent) : '', emplacement:(a[0].emplacement || '').trim(),
        statut:'active', destruction:'', notes:(a[0].notes || '').trim(), creePar:moi, creeLe:it.at, queued:true });
    } else if (it.fn === 'modifierMere') {
      const m = trouve(a[0]); if (!m) return;
      ['surnom', 'emplacement', 'notes', 'cultivar', 'lot'].forEach(k => { if (k in a[1]) m[k] = String(a[1][k]).trim(); });
      if ('creation' in a[1] && a[1].creation !== m.creation) { m.creation = a[1].creation; m.source = a[1].creation ? 'saisie' : 'inconnue'; }
    } else if (it.fn === 'prendreBoutures') {
      a[0].lignes.forEach((l, i) => { const m = trouve(l.numero);
        d.boutures.push({ id:'att-' + it.id + '-' + i, date:a[0].date, numero:m ? m.numero : l.numero, nb:String(l.nb), cultivar:m ? m.cultivar : '',
          salle:a[0].salle, lot:a[0].lot, par:moi, notes:a[0].notes || '', queued:true }); });
    } else if (it.fn === 'detruire') {
      const m = trouve(a[0].numero); if (!m) return;

let flushing = false, flushTimer = null, flushDelay = 3000, apresFile = null;

async function flushOutbox() {
  if (flushing || !S.auth || !S.srv) return;
  const user = S.auth.nom; let q = qGet(); if (!q.length) { flushDelay = 3000; rappelFile(); return; }
  flushing = true; let envoye = false;
  try {
    while (q.length && S.auth && S.auth.nom === user) {
      const it = q[0];
      try {
        await run(it.fn, ...it.args, it.id);
        q = qGet().filter(x => x.id !== it.id); qSet(q); flushDelay = 3000; envoye = true;
      } catch (e) {
        // Seul un refus de contenu est définitif ; tout le reste (réseau, lenteur de Google, verrou, code) est réessayé.
        if (!e.definitif) { flushDelay = Math.min(flushDelay * 2, 120000); break; }
        q = qGet().filter(x => x.id !== it.id); qSet(q); recalc();
        alerte(LIBELLE[it.fn] + ' refusée par le registre : ' + errMsg(e));
      }
    }
  } finally {
    flushing = false;
    if (qGet().length) scheduleFlush(flushDelay);
    // File vidée : on recharge les données du serveur (identifiants définitifs, saisies des collègues).
    else if (envoye) { clearTimeout(apresFile); apresFile = setTimeout(() => refresh(true), 300); }
    rappelFile();
  }
}

    '<h2>Boutures <small>' + tot + ' sur 13 mois</small></h2>' +
    (bt.length ? '<div class="kv">' + bt.map(b => '<div><span>' + fDate(b.date) + ' · ' + esc(b.salle) + ' · lot ' + esc(b.lot) + '</span><b>×' + esc(b.nb) + '</b></div>').join('') + '</div>' : '<div class="empty">Aucune prise inscrite.</div>') +
    (enfants.length ? '<h2>Mères issues de celle-ci</h2>' + enfants.map(carteMere).join('') : ''));
}

/* Nouvelle mère */
function formMere() {

  ouvrir(tete('Nouvelle mère') +
    '<label for="m-num">Numéro unique (forme complète)</label><input id="m-num" type="text" autocapitalize="characters" autocomplete="off" placeholder="202411020026_036BG">' +
    '<div class="hint" id="m-hint">Numéro attribué par Marc : 12 chiffres, « _ », lot.</div>' +
    '<label class="check" style="margin-top:8px"><input type="checkbox" id="m-libre"> Numéro hors format (exceptionnel)</label>' +
    '<div class="two"><div><label for="m-surnom">Surnom (usage interne)</label><input id="m-surnom" type="text" placeholder="Z2, T1…"></div>' +
    '<div><label for="m-lot">Lot</label><input id="m-lot" type="text" autocapitalize="characters" placeholder="déduit du numéro"></div></div>' +
    '<label for="m-cult">Cultivar</label><input id="m-cult" type="text" list="dl-cult">' + datalistCult() +
    '<label for="m-crea">Date de création</label><input id="m-crea" type="date" max="' + S.d.today + '">' +
    '<div class="hint">Laissez vide : la date sera lue dans le numéro, ou notée « inconnue ».</div>' +
    '<label for="m-parent">Mère d\'origine (facultatif)</label><select id="m-parent"><option value="">—</option>' +
    actives().map(m => '<option value="' + esc(m.numero) + '">' + esc(nomMere(m)) + ' — ' + esc(abrege(m.numero)) + '</option>').join('') + '</select>' +
    '<label for="m-empl">Emplacement</label><input id="m-empl" type="text" placeholder="Salle 2, table…">' +
    '<label for="m-notes">Notes</label><textarea id="m-notes"></textarea>' +
    pied('Enregistrer', 'm-ok'));
  const maj = () => {
    const n = norm($('m-num').value), h = $('m-hint');
    if (!n) { h.className = 'hint'; h.textContent = 'Numéro attribué par Marc : 12 chiffres, « _ », lot.'; return; }
    if (mere(n)) { h.className = 'hint bad'; h.textContent = 'Ce numéro existe déjà.'; return; }
    if (!FORMAT.test(n)) { h.className = 'hint bad'; h.textContent = 'Format incomplet : la forme longue est attendue (ex. 202411020026_036BG).'; return; }
    const d = dateDuNumero(n);
    h.className = 'hint ok'; h.textContent = 'Lot ' + lotDuNumero(n) + (d ? ' · créée le ' + fDate(d) + ' (lue dans le numéro)' : ' · date non lisible dans le numéro');
  };
  $('m-num').addEventListener('input', maj);
  $('m-parent').addEventListener('change', () => { const p = mere($('m-parent').value); if (p && !$('m-cult').value) $('m-cult').value = p.cultivar; });
  $('m-ok').onclick = () => soumettre('m-ok', async () => {
    const n = norm($('m-num').value), libre = $('m-libre').checked;
    nonVide(n, 'Le numéro unique est obligatoire.');
    if (!FORMAT.test(n) && !libre) throw new Error('Le numéro doit être au format complet (12 chiffres, « _ », lot), par exemple 202411020026_036BG.');
    if (mere(n)) throw new Error('Ce numéro existe déjà : ' + n + '.');
    nonVide($('m-cult').value, 'Le cultivar est obligatoire.');
    if ($('m-crea').value) pasFutur($('m-crea').value, 'La date de création ne peut pas être dans le futur.');
    enfiler('creerMere', [{ numero:n, surnom:$('m-surnom').value, lot:$('m-lot').value, cultivar:$('m-cult').value,
      creation:$('m-crea').value, parent:$('m-parent').value, emplacement:$('m-empl').value, notes:$('m-notes').value, formatLibre:libre }]);
    fermer(); toast('Mère enregistrée');
  });
}

/* Modifier une fiche */
function formModif(num) {
  const m = mere(num), adm = isAdmin(), dateLibre = adm || !m.creation;
  ouvrir(tete('Modifier — ' + esc(m.surnom || abrege(m.numero))) +
    '<div class="num">' + esc(m.numero) + '</div>' +
    '<label for="e-surnom">Surnom</label><input id="e-surnom" type="text" value="' + esc(m.surnom) + '">' +
    (adm ? '<label for="e-cult">Cultivar</label><input id="e-cult" type="text" list="dl-cult" value="' + esc(m.cultivar) + '">' + datalistCult() +
      '<label for="e-lot">Lot</label><input id="e-lot" type="text" value="' + esc(m.lot) + '">' : '') +
    '<label for="e-crea">Date de création</label><input id="e-crea" type="date" max="' + S.d.today + '" value="' + esc(m.creation) + '"' + (dateLibre ? '' : ' disabled') + '>' +
    (dateLibre ? '' : '<div class="hint">Seul un administrateur peut changer une date déjà connue.</div>') +
    '<label for="e-empl">Emplacement</label><input id="e-empl" type="text" value="' + esc(m.emplacement) + '">' +
    '<label for="e-notes">Notes</label><textarea id="e-notes">' + esc(m.notes) + '</textarea>' +
    pied('Enregistrer', 'e-ok'));
  $('e-ok').onclick = () => soumettre('e-ok', async () => {
    const ch = { surnom:$('e-surnom').value, emplacement:$('e-empl').value, notes:$('e-notes').value };
    if (dateLibre) ch.creation = $('e-crea').value;
    if (adm) { ch.cultivar = $('e-cult').value; ch.lot = $('e-lot').value; }
    if (adm) nonVide(ch.cultivar, 'Le cultivar est obligatoire.');
    if (ch.creation) pasFutur(ch.creation, 'La date de création ne peut pas être dans le futur.');
    enfiler('modifierMere', [m.numero, ch]); fiche(m.numero); toast('Fiche mise à jour');
  });
}

/* Prise de boutures (une ou plusieurs mères) */
function formPrise(pre) {
  const act = actives();
  if (!act.length) { toast('Aucune mère active.'); return; }
  const cults = [...new Set(act.map(m => m.cultivar))].sort((a, b) => a.localeCompare(b, 'fr'));
  const c0 = pre ? mere(pre).cultivar : (cults.length === 1 ? cults[0] : 'Tous');
  ouvrir(tete('Prise de boutures') +
    '<div class="two"><div><label for="p-date">Date</label><input id="p-date" type="date" max="' + S.d.today + '" value="' + S.d.today + '"></div>' +
    '<div><label for="p-salle">Salle de destination</label><select id="p-salle"><option value="">—</option>' + S.d.salles.map(s => '<option>' + esc(s) + '</option>').join('') + '</select></div></div>' +
    '<label for="p-lot">No. de lot</label><input id="p-lot" type="text" autocapitalize="characters" placeholder="ex. S4R16">' +
    '<label>Mères et nombre de boutures</label>' +
    '<div class="chips" id="p-cults">' + ['Tous'].concat(cults).map(c => '<button class="chip' + (c === c0 ? ' on' : '') + '" data-pc="' + esc(c) + '">' + esc(c) + '</button>').join('') + '</div>' +
    '<div id="p-list">' + act.sort((a, b) => a.cultivar.localeCompare(b.cultivar, 'fr') || (a.surnom || '').localeCompare(b.surnom || '', 'fr', { numeric:true }))
      .map(m => '<div class="pick" data-c="' + esc(m.cultivar) + '"><div class="l"><b>' + esc(nomMere(m)) + '</b><div class="num">' + esc(abrege(m.numero)) + '</div></div>' +
        '<input type="number" inputmode="numeric" min="0" step="1" placeholder="0" data-pn="' + esc(m.numero) + '"' + (pre && norm(pre) === norm(m.numero) ? ' autofocus' : '') + '></div>').join('') + '</div>' +
    '<div class="total" id="p-tot">Total : 0 bouture</div>' +
    '<label for="p-notes">Notes</label><input id="p-notes" type="text">' +
    pied('Enregistrer', 'p-ok'));
  const filtre = c => { document.querySelectorAll('#p-cults .chip').forEach(b => b.classList.toggle('on', b.dataset.pc === c));
    document.querySelectorAll('#p-list .pick').forEach(p => p.classList.toggle('hidden', c !== 'Tous' && p.dataset.c !== c && !(+p.querySelector('input').value))); };
  filtre(c0);
  $('p-cults').onclick = e => { const b = e.target.closest('[data-pc]'); if (b) filtre(b.dataset.pc); };
  const lignes = () => [...document.querySelectorAll('[data-pn]')].map(i => ({ numero:i.dataset.pn, nb:+i.value || 0 })).filter(l => l.nb > 0);
  $('p-list').addEventListener('input', () => { const t = lignes().reduce((s, l) => s + l.nb, 0), n = lignes().length;
    $('p-tot').textContent = 'Total : ' + t + ' bouture' + (t > 1 ? 's' : '') + (n ? ' · ' + n + ' mère' + (n > 1 ? 's' : '') : ''); });
  $('p-ok').onclick = () => soumettre('p-ok', async () => {
    const date = $('p-date').value, L = lignes();
    pasFutur(date); nonVide($('p-salle').value, 'Choisissez la salle de destination.'); nonVide($('p-lot').value, 'Le numéro de lot est obligatoire.');
    if (!L.length) throw new Error('Indiquez au moins une mère et un nombre de boutures.');
    L.forEach(l => { const m = mere(l.numero); if (l.nb !== Math.round(l.nb) || l.nb > 5000) throw new Error('Nombre de boutures invalide pour ' + nomMere(m) + '.');
      if (m.creation && m.creation > date) throw new Error('La mère ' + nomMere(m) + " n'existait pas encore à cette date."); });
    enfiler('prendreBoutures', [{ date, salle:$('p-salle').value, lot:$('p-lot').value.trim(), notes:$('p-notes').value, lignes:L }]); fermer();
    const t = L.reduce((s, l) => s + l.nb, 0); toast(t + ' bouture' + (t > 1 ? 's' : '') + ' enregistrée' + (t > 1 ? 's' : ''));
  });
}

/* Destruction */
function formDetr(pre) {
  const act = actives(), T = S.d.temoins;
  if (!act.length) { toast('Aucune mère active.'); return; }
  const optT = sel => '<option value="">—</option>' + T.map(t => '<option' + (t.nom === sel ? ' selected' : '') + '>' + esc(t.nom) + '</option>').join('');
  ouvrir(tete('Destruction') +
    (T.length < 2 ? '<div class="alert">Moins de deux témoins habilités sont inscrits (onglet « Témoins » du Sheet). La destruction ne pourra pas être enregistrée.</div>' : '') +
    '<label for="d-mere">Mère</label><select id="d-mere">' + (pre ? '' : '<option value="">—</option>') +
    act.filter(m => !pre || norm(m.numero) === norm(pre)).map(m => '<option value="' + esc(m.numero) + '">' + esc(nomMere(m)) + ' — ' + esc(abrege(m.numero)) + '</option>').join('') + '</select>' +
    '<div class="two"><div><label for="d-date">Date</label><input id="d-date" type="date" max="' + S.d.today + '" value="' + S.d.today + '"></div>' +
    '<div><label for="d-poids">Poids net (g)</label><input id="d-poids" type="number" inputmode="decimal" min="0" step="0.1"></div></div>' +
    '<label for="d-meth">Méthode de destruction</label><input id="d-meth" type="text" list="dl-meth"' + (S.d.methodes.length === 1 ? ' value="' + esc(S.d.methodes[0]) + '"' : '') + '>' +
    '<datalist id="dl-meth">' + S.d.methodes.map(x => '<option value="' + esc(x) + '">').join('') + '</datalist>' +
    '<label>Raison</label><div class="pills">' + RAISONS.map((r, i) => '<label><input type="radio" name="d-r" value="' + esc(r) + '"' + (i === 0 ? '' : '') + '><span>' + esc(r) + '</span></label>').join('') + '</div>' +
    '<input id="d-raison" type="text" placeholder="Précision (obligatoire pour « Autre »)" style="margin-top:8px">' +
    '<div class="two"><div><label for="d-t1">Témoin 1</label><select id="d-t1">' + optT('') + '</select></div>' +
    '<div><label for="d-t2">Témoin 2</label><select id="d-t2">' + optT('') + '</select></div></div>' +
    '<label class="check" style="margin-top:12px"><input type="checkbox" id="d-rsdc"> Déjà inscrite au RSDC</label>' +
    pied('Enregistrer la destruction', 'd-ok'));
  $('d-ok').onclick = () => soumettre('d-ok', async () => {
    const r0 = (document.querySelector('[name=d-r]:checked') || {}).value || '', prec = $('d-raison').value.trim();
    if (!r0) throw new Error('Choisissez la raison de la destruction.');
    if (r0 === 'Autre' && !prec) throw new Error('Précisez la raison.');
    const raison = r0 === 'Autre' ? prec : r0 + (prec ? ' — ' + prec : '');
    const num = $('d-mere').value; if (!num) throw new Error('Choisissez la mère.');
    const m = mere(num), date = $('d-date').value, poids = parseFloat(String($('d-poids').value).replace(',', '.')), t1 = $('d-t1').value, t2 = $('d-t2').value;
    pasFutur(date); if (m.creation && date < m.creation) throw new Error('La date de destruction précède la date de création.');
    if (!(poids > 0) || poids > 100000) throw new Error('Indiquez le poids net en grammes.');
    nonVide($('d-meth').value, 'Indiquez la méthode de destruction.');
    if (S.d.temoins.length < 2) throw new Error("Moins de deux témoins habilités sont inscrits : la destruction ne peut pas être enregistrée.");
    if (!t1 || !t2) throw new Error('Deux témoins habilités sont obligatoires.');
    if (t1 === t2) throw new Error('Les deux témoins doivent être des personnes différentes.');
    if (!confirm('Confirmer la destruction de ' + nomMere(m) + ' (' + m.numero + ') ? Cette action ne peut être annulée que par un administrateur.')) return;
    enfiler('detruire', [{ numero:m.numero, date, poids, methode:$('d-meth').value.trim(), raison, temoin1:t1, temoin2:t2, rsdc:$('d-rsdc').checked }]);
    fermer(); toast('Destruction enregistrée');
  });
}

/* Destruction : plant mère (registre avec poids et témoins) ou plants d'un lot (nombre seulement) */
function choixDestruction() {
  ouvrir(tete('Destruction') +
    '<div class="foot" style="flex-direction:column"><button class="btn pri" data-dlot="">Détruire des plants d\'un lot</button>' +
    '<button class="btn" data-detr="">Détruire un plant mère</button></div>');
}

/* Destruction de plants d'un lot de boutures */
function formDetrPlants(preCle) {
  const L = lots();
  if (!L.length) { toast('Aucun lot de boutures sur les 13 derniers mois.'); return; }
  const x0 = L.find(x => x.cle === preCle) || L.find(x => x.restants > 0) || L[0];
  const etape0 = x0.detruits['En salle'] ? 'En salle' : '4 pouces';
  ouvrir(tete('Détruire des plants d\'un lot') +
    '<label for="dp-lot">Lot</label><select id="dp-lot">' + L.map(x => '<option value="' + esc(x.cle) + '"' + (x === x0 ? ' selected' : '') + '>Lot ' + esc(x.lot) + ' · ' +
      esc(x.salle) + ' — ' + x.restants + ' restant' + (x.restants > 1 ? 's' : '') + ' / ' + x.preleves + '</option>').join('') + '</select>' +
    '<label>Étape</label><div class="pills">' + ETAPES.map(e => '<label><input type="radio" name="dp-e" value="' + esc(e) + '"' + (e === etape0 ? ' checked' : '') + '><span>' + esc(e) + '</span></label>').join('') + '</div>' +
    '<div class="two"><div><label for="dp-date">Date</label><input id="dp-date" type="date" max="' + S.d.today + '" value="' + S.d.today + '"></div>' +
    '<div><label for="dp-nb">Nombre de plants</label><input id="dp-nb" type="number" inputmode="numeric" min="1" step="1"></div></div>' +
    '<label>Raison</label><div class="pills">' + RAISONS_PLANTS.map((r, i) => '<label><input type="radio" name="dp-r" value="' + esc(r) + '"' + (i === 0 ? ' checked' : '') + '><span>' + esc(r) + '</span></label>').join('') + '</div>' +
    '<input id="dp-raison" type="text" placeholder="Précision (obligatoire pour « Autre »)" style="margin-top:8px">' +
    '<label for="dp-notes">Notes</label><textarea id="dp-notes"></textarea>' +
    '<h2>Décompte du lot</h2><div id="dp-dec"></div>' +
    pied('Enregistrer la destruction', 'dp-ok'));
  const lot = () => L.find(x => x.cle === $('dp-lot').value);
  const etape = () => (document.querySelector('[name=dp-e]:checked') || {}).value || '';
  const nombre = () => { const n = Number($('dp-nb').value); return n > 0 ? n : 0; };
  const maj = () => { const x = lot(), a = { etape:etape(), nombre:nombre() };
    $('dp-dec').innerHTML = decompteHtml(x, a) + avertTransfert(x, a) +
      (a.nombre > x.restants ? '<div class="hint bad" style="margin-top:6px">Plus que les ' + pl(x.restants) + ' restants du lot.</div>' : ''); };
  $('dp-lot').addEventListener('change', maj); $('dp-nb').addEventListener('input', maj);
  document.querySelectorAll('[name=dp-e]').forEach(r => r.addEventListener('change', maj));
  maj();
  $('dp-ok').onclick = () => soumettre('dp-ok', async () => {
    const x = lot(), date = $('dp-date').value, n = Number($('dp-nb').value), e = etape();
    pasFutur(date);
    if (date < x.debut) throw new Error('La date précède la prise de boutures du lot (' + fDate(x.debut) + ').');
    if (!ETAPES.includes(e)) throw new Error("Choisissez l'étape.");
    if (!(n > 0) || !Number.isInteger(n)) throw new Error('Le nombre de plants doit être un entier supérieur à 0.');
    if (n > x.restants) throw new Error('Le lot ' + x.lot + ' n\'a plus que ' + pl(x.restants) + ' (prélevées : ' + x.preleves + ').');
    const r0 = (document.querySelector('[name=dp-r]:checked') || {}).value || '', prec = $('dp-raison').value.trim();
    if (r0 === 'Autre' && !prec) throw new Error('Précisez la raison.');
    const raison = r0 === 'Autre' ? prec : r0 + (prec ? ' — ' + prec : '');
    enfiler('detruirePlants', [{ date, lot:x.lot, etape:e, nombre:n, raison, notes:$('dp-notes').value.trim() }]);
    fermer(); toast(pl(n) + ' détruit' + (n > 1 ? 's' : '') + ' — lot ' + x.lot);
  });
}

function formMotif(titre, lib, fn) {
  ouvrir(tete(titre) + '<label for="x-motif">Motif (inscrit au journal)</label><textarea id="x-motif"></textarea>' + pied(lib, 'x-ok'));
  $('x-ok').onclick = () => soumettre('x-ok', async () => { const m = $('x-motif').value.trim(); nonVide(m, 'Indiquez le motif.'); fn(m); fermer(); });
}

/* ---------- Évènements ---------- */
$('l-go').onclick = login;
$('l-code').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
$('logout').onclick = () => { if (confirm('Se déconnecter ?')) logout(); };
$('refresh').onclick = () => refresh(false);
document.querySelector('.tabs').onclick = e => { const b = e.target.closest('[data-v]'); if (b) setVue(b.dataset.v); };
$('fab').onclick = () => S.vue === 'meres' ? formMere() : S.vue === 'boutures' ? formPrise() : choixDestruction();
$('ov').onclick = e => { if (e.target === $('ov') || e.target.closest('[data-close]')) fermer(); };
$('hdr-extra').addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; renderMeres(); } });
$('hdr-extra').addEventListener('click', e => { const b = e.target.closest('[data-cult]'); if (b) { S.cult = b.dataset.cult; render(); } });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-filtre],[data-mere],[data-prise],[data-detr],[data-modif],[data-rsdc],[data-annd],[data-supb],[data-dlot],[data-andp]');
  if (!t) return;
  const d = t.dataset;
  if (d.filtre) { S.filtre = d.filtre; renderMeres(); }
  else if (d.mere) fiche(d.mere);
  else if (d.prise) formPrise(d.prise);
  else if (d.detr !== undefined) formDetr(d.detr);
  else if (d.dlot !== undefined) formDetrPlants(d.dlot);
  else if (d.andp) formMotif('Annuler la destruction de plants', 'Annuler la destruction', m => { enfiler('annulerDestructionPlants', [d.andp, m]); toast('Destruction annulée'); });
  else if (d.modif) formModif(d.modif);
  else if (d.rsdc) { if (confirm('Confirmer que cette destruction est inscrite au RSDC ?')) { enfiler('marquerRsdc', [d.rsdc]); toast('RSDC complété'); } }
  else if (d.annd) formMotif('Annuler la destruction', 'Annuler la destruction', m => { enfiler('annulerDestruction', [d.annd, m]); toast('Destruction annulée'); });
  else if (d.supb) formMotif('Supprimer la ligne de boutures', 'Supprimer', m => { enfiler('supprimerBouture', [d.supb, m]); toast('Ligne supprimée'); });
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.d) { scheduleFlush(0); refresh(true); } });
initLogin();
</script>
